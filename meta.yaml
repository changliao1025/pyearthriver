{% set name = "pyearthriver" %}
{% set version = "0.1.1" %}
{% set git_rev = "main" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  git_rev: {{ git_rev }}
  git_url: https://github.com/changliao1025/pyearthriver

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [win and vc<14]

requirements:
  build:
    - {{ stdlib("c") }}
    - {{ compiler('c') }}
  host:
    - python >={{ python_min }}
    - pip
    - setuptools >=61.0
    - wheel
    - cython >=0.29.0
    - numpy >=1.20.0
  run:
    - python >={{ python_min }}
    - {{ pin_compatible('numpy') }}
    - scipy >=1.7.0
    - pyearth >=0.2.5
    - rtree >=0.9.0

test:
  imports:
    - pyearthriver
    - pyearthriver.classes
    - pyearthriver.algorithms
    - pyearthriver.formats
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/changliao1025/pyearthriver
  summary: A Python library for analyzing and processing river network flowlines using graph-based algorithms.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - changliao1025
  feedstock-name: {{ name|lower }}
